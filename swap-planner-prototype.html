<!DOCTYPE html>
<html lang="en" class="wa-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unlisted utility page: not in nav, not for search engines -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Swap Planner PROTOTYPE - PRISM</title>
    <style>.wa-cloak { visibility: hidden; }</style>
    <style>wa-page:not(:defined) { visibility: hidden; }</style>
    <!-- CDN resilience. Both rules above hide the page until Web Awesome loads, and
         nothing removes them if it never does, so a blocked or stalled kit leaves a
         blank white document. Reveal at 5s regardless: unstyled but readable beats
         invisible. WA removes the class itself on a normal load, well before this. -->
    <style>
      @keyframes prism-uncloak { to { visibility: visible; } }
      .wa-cloak,
      wa-page:not(:defined) { animation: prism-uncloak 0s linear 5s forwards; }
    </style>
    <!-- iOS Home Screen icon (layout.js injects these as a fallback) -->
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/site.webmanifest" />
    <meta name="theme-color" content="#281645" />
    <meta name="apple-mobile-web-app-title" content="PRISM" />
    <!-- Preconnect to CDNs (Supabase SDK on cdn.jsdelivr.net is lazy-loaded for logged-in users) -->
    <link rel="preconnect" href="https://ka-p.webawesome.com" />
    <link rel="preconnect" href="https://ka-p.webawesome.com" crossorigin />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://use.typekit.net" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <!-- Web Awesome, fonts, and app CSS as static tags so the browser preload scanner
         starts them immediately; layout.js injectHeadResources skips tags already present -->
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/da021fed1e5141f2/webawesome@3.14.0/styles/themes/default.css" />
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/da021fed1e5141f2/webawesome@3.14.0/styles/native.css" />
    <link rel="stylesheet" href="https://ka-p.webawesome.com/kit/da021fed1e5141f2/webawesome@3.14.0/styles/utilities.css" />
    <script type="module" src="https://ka-p.webawesome.com/kit/da021fed1e5141f2/webawesome@3.14.0/webawesome.loader.js"></script>
    <link rel="stylesheet" href="https://fonts.bunny.net/css2?family=Geist+Mono:wght@100..900&display=swap" />
    <link rel="stylesheet" href="https://use.typekit.net/gbw6ibc.css" />
    <style>
      /* PROTOTYPE styles, throwaway */
      .sp-search { max-width: 28rem; }
      .sp-incoming { display: flex; gap: var(--wa-space-l); align-items: center; }
      .sp-incoming-img { width: 8rem; border-radius: var(--wa-border-radius-l); box-shadow: var(--wa-shadow-m); }
      .sp-list { list-style: none; margin: 0; padding: 0; }
      .sp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--wa-space-m);
        width: 100%; height: auto; padding: var(--wa-space-s) var(--wa-space-m); white-space: normal; line-height: var(--wa-line-height-normal);
        border: var(--wa-border-width-s) solid var(--wa-color-surface-border); border-radius: var(--wa-border-radius-m);
        background: var(--wa-color-surface-default); color: inherit; font: inherit; text-align: start; cursor: pointer;
        transition: border-color var(--wa-transition-fast), background-color var(--wa-transition-fast); }
      .sp-row:hover { border-color: var(--wa-color-brand-border-normal); background: var(--wa-color-brand-fill-quiet); }
      .sp-row:focus-visible { outline: var(--wa-focus-ring); outline-offset: var(--wa-focus-ring-offset); }
      .sp-row-main { display: flex; flex-direction: column; gap: var(--wa-space-2xs); min-width: 0; }
      .sp-row-title { overflow-wrap: anywhere; }
      .sp-row-end { display: flex; align-items: center; gap: var(--wa-space-s); }
      .sp-chevron { color: var(--wa-color-text-quiet); }
      .sp-decks { display: flex; flex-wrap: wrap; gap: var(--wa-space-2xs) var(--wa-space-m); }
      .sp-deck { display: inline-flex; align-items: center; gap: var(--wa-space-2xs); font-size: var(--wa-font-size-s); color: var(--wa-color-text-quiet); }
      .sp-swatch { inline-size: var(--wa-space-2xs); block-size: 1em; border-radius: var(--wa-border-radius-s); background: var(--deck); flex: none; }
      .sp-far::part(content) { padding-block-start: var(--wa-space-s); }
      .sp-meta { color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
      .sp-card { font-weight: var(--wa-font-weight-semibold); text-decoration: underline dotted; text-underline-offset: 0.2em; cursor: help; }
      .sp-cost-headline { font-size: var(--wa-font-size-xl); font-weight: var(--wa-font-weight-bold); }
      .sp-cost-headline.sp-sleeve { color: var(--wa-color-success-on-quiet); }
      .sp-checklist { padding: var(--wa-space-m); background: var(--wa-color-neutral-fill-quiet); border-radius: var(--wa-border-radius-m); }
      #sp-dialog { --width: min(46rem, 94vw); }
      .sp-compare { display: flex; align-items: center; justify-content: center; gap: var(--wa-space-m); margin-block-end: var(--wa-space-l); }
      .sp-compare figure { margin: 0; align-items: center; }
      .sp-compare-arrow { font-size: var(--wa-font-size-xl); color: var(--wa-color-text-quiet); flex: none; }
      .sp-slot { inline-size: 244px; block-size: 340px; }
      #sp-toast { position: fixed; inset-block-end: var(--wa-space-l); inset-inline-end: var(--wa-space-l); max-inline-size: 24rem; z-index: 9998; }
      @media (max-width: 768px) {
        .sp-incoming { align-items: flex-start; }
        .sp-incoming-img { width: 6rem; }
        .sp-compare { gap: var(--wa-space-2xs); }
        .sp-slot { zoom: 0.55; }
      }
    </style>
  </head>
  <body>
    <wa-page mobile-breakpoint="768">
      <main style="max-width: 900px; margin: 0 auto; padding: var(--wa-space-xl);">
        <div class="wa-stack wa-gap-xl">
          <wa-callout variant="warning">PROTOTYPE (#276), round 3. Nothing is saved.</wa-callout>
          <div class="wa-stack wa-gap-s">
            <h1 class="wa-heading-xl">Swap Planner</h1>
            <p style="color: var(--wa-color-text-quiet); max-width: 70ch;">
              Search a card you just got. See the cards it could replace across your decks, and what each Swap costs in marks.
              <a href="guide.html#swap-a-card">How to compare cards →</a>
            </p>
            <span id="sp-prism" class="sp-meta"></span>
          </div>
          <div class="wa-stack wa-gap-xs sp-search">
            <label for="sp-search" class="wa-heading-s">Card to swap in</label>
            <input id="sp-search" list="sp-suggest" placeholder="Start typing a card name" autocomplete="off" />
            <datalist id="sp-suggest"></datalist>
            <span id="sp-status" class="sp-meta" role="status"></span>
          </div>
          <div id="sp-root" class="wa-stack wa-gap-xl"></div>
          <details>
            <summary>Prototype state</summary>
            <pre id="sp-state" style="font-size: var(--wa-font-size-xs); white-space: pre-wrap;"></pre>
          </details>
        </div>
      </main>
    </wa-page>
    <wa-dialog id="sp-dialog" label="Swap">
      <div data-body></div>
      <wa-button slot="footer" appearance="plain" data-dialog="close">Cancel</wa-button>
      <wa-button slot="footer" variant="brand" data-apply>Swap</wa-button>
    </wa-dialog>
    <wa-callout id="sp-toast" variant="success" hidden><wa-icon slot="icon" name="circle-check"></wa-icon><span data-msg></span></wa-callout>
    <script type="module">
      import { initLayout } from './js/layout.js';
      import { initSwapPlannerPrototype } from './js/features/swap-planner-prototype.js';
      initLayout({ activePage: '', headerCta: { href: 'build.html', label: 'Build PRISM', icon: 'wand-magic-sparkles' } });
      initSwapPlannerPrototype();
    </script>
  </body>
</html>
